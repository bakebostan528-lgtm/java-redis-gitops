apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-app
        image: hashicorp/http-echo:latest
        args:
          - "-text=Hello from Kubernetes!"
        ports:
        - containerPort: 5678
